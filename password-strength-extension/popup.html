<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KeyGuard Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .header img {
      width: 24px;
      height: 24px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 10px;
      background: #312e81;
      color: #a5b4fc;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
      margin-left: auto;
    }
    .section {
      margin-top: 14px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-info h2 {
      font-size: 13px;
      font-weight: 500;
    }
    .toggle-info p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Generator Box */
    .generator-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .gen-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .pass-preview {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      user-select: all;
      overflow-x: auto;
    }
    .gen-actions {
      display: flex;
      gap: 6px;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .copied-toast {
      color: var(--success);
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
      height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="KeyGuard">
    <h1>KeyGuard</h1>
    <span class="badge">v1.1</span>
  </div>

  <div class="section">
    <div class="toggle-row">
      <div class="toggle-info">
        <h2>In-Page Popups</h2>
        <p>Show strength meter next to password inputs</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="generator-card">
      <div class="gen-title">Quick Password Generator</div>
      <div class="pass-preview" id="pass-output">••••••••••••••••</div>
      <div class="gen-actions">
        <button class="btn btn-secondary" id="btn-refresh">Regenerate</button>
        <button class="btn btn-primary" id="btn-copy">Copy</button>
      </div>
      <div class="copied-toast" id="toast"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
